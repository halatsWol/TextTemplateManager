name: Release

# Push a version tag (e.g. v0.9.3) to build the installer and publish a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags, so the delta step can find the previous release tag

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag -replace '^v', ''
          "version=$v" >> $env:GITHUB_OUTPUT
          # A tag with beta / preview / unstable / prev is published as a GitHub pre-release, so it
          # is only offered to clients that have "Allow beta updates" enabled.
          $pre = if ($tag -match '(?i)beta|prev|unstable') { 'true' } else { 'false' }
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v (prerelease=$pre)"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          # Enter the MSVC x64 developer environment so NativeAOT (the cleanup utility) links reliably,
          # independent of what's on PATH. Uses VS's own shipped DevShell module (no third-party action);
          # falls back to package.ps1's vswhere-on-PATH fix if VS can't be located.
          $repo = $PWD
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if ($vsPath) {
            Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
            Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
            Set-Location $repo
            Write-Host "MSVC dev environment ready ($vsPath)."
          } else {
            Write-Host "::warning::VS C++ tools not located via vswhere; relying on package.ps1 PATH fallback."
          }
          ./package.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Name the installers with the version
        shell: pwsh
        run: |
          # Only the installers carry the version in their file name — the delta names already do, and
          # a versioned Setup makes it obvious which build someone downloaded. The manuals and the
          # cleanup utility stay unversioned, so a link to them keeps working across releases.
          Copy-Item "installer/TextTemplateManager-Setup.exe" `
                    "installer/TextTemplateManager-Setup-${{ steps.ver.outputs.version }}.exe"
          # package.ps1 regenerates the manual PDF (Assets/Manual.pdf) — ship it as an asset too.
          # The admin guide and the cleanup utility are already in installer/ under their final names.
          Copy-Item "Assets/Manual.pdf" "installer/TextTemplateManager-Manual.pdf"

      - name: Build delta installers (one per supported base version)
        id: delta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every base a user could still be running in the current line gets its own delta, so a
          # patch release is reachable from anywhere in its minor series rather than only from the
          # release immediately before it:
          #   1.3.2  <- 1.3.0, 1.3.1          (patch release: its own minor line)
          #   1.4.0  <- every 1.3.*           (new minor: the whole previous line)
          #   1.4.1  <- 1.4.0                 (the 1.4 line has only started)
          # Anything older than that falls back to the full installer, which always works.
          #
          # Resilient throughout: any missing prerequisite or failure drops that one delta (or all of
          # them) and still publishes the full installer.
          $tag = "${{ github.ref_name }}"
          $to  = "${{ steps.ver.outputs.version }}"
          # A release whose commit message contains [skip-delta] ships full-only. Use it for the AppId
          # migration release: a delta can't uninstall+reinstall to swap the AppId, so everyone must
          # take the full installer that release; deltas resume the release after.
          $headMsg = (git log -1 --pretty=%B "$tag" 2>$null | Out-String)
          if ($headMsg -match '\[skip-delta\]') { Write-Host "[skip-delta] present -> full-only release."; exit 0 }

          function Split-Ver([string]$v) {
            $n = [regex]::Match($v, '^\d+(\.\d+)*').Value
            if (-not $n) { return $null }
            $p = $n.Split('.')
            [pscustomobject]@{
              Major = [int]$p[0]
              Minor = $(if ($p.Count -gt 1) { [int]$p[1] } else { 0 })
              Patch = $(if ($p.Count -gt 2) { [int]$p[2] } else { 0 })
            }
          }

          $cur = Split-Ver $to
          if (-not $cur) { Write-Host "Unparseable version '$to' — full-only release."; exit 0 }

          $all = @(git tag --list 'v*' | ForEach-Object {
            $t = $_.Trim()
            if ($t -and $t -ne $tag) {
              $v = $t -replace '^v', ''
              $s = Split-Ver $v
              if ($s) { [pscustomobject]@{ Tag = $t; Version = $v; Major = $s.Major; Minor = $s.Minor; Patch = $s.Patch } }
            }
          })

          if ($cur.Patch -gt 0) {
            $bases = @($all | Where-Object { $_.Major -eq $cur.Major -and $_.Minor -eq $cur.Minor -and $_.Patch -lt $cur.Patch })
          } else {
            $prev = @($all | Where-Object { $_.Major -lt $cur.Major -or ($_.Major -eq $cur.Major -and $_.Minor -lt $cur.Minor) } |
                     Sort-Object Major, Minor | Select-Object -Last 1)
            $bases = if ($prev) { @($all | Where-Object { $_.Major -eq $prev[0].Major -and $_.Minor -eq $prev[0].Minor }) } else { @() }
          }
          $bases = @($bases | Sort-Object Major, Minor, Patch)
          if ($bases.Count -eq 0) { Write-Host "No earlier release in scope — full-only release."; exit 0 }
          Write-Host "Delta bases: $($bases.Version -join ', ')"

          $full = "installer/TextTemplateManager-Setup-$to.exe"
          $fullSize = (Get-Item $full).Length
          $built = @()
          foreach ($b in $bases) {
            $dir = "prevrel/$($b.Version)"
            New-Item -ItemType Directory -Force $dir | Out-Null
            gh release download $b.Tag -p manifest.json -D $dir 2>$null
            if (-not (Test-Path "$dir/manifest.json")) {
              Write-Host "No manifest.json on $($b.Tag) (pre-1.2) — skipping that base."; continue
            }
            try {
              ./package-delta.ps1 -FromVersion $b.Version -ToVersion $to -PrevManifest "$dir/manifest.json"
            } catch {
              Write-Host "::warning::Delta from $($b.Version) failed ($_) — skipping that base."; continue
            }
            $info = Get-Content "installer/delta-info.json" -Raw | ConvertFrom-Json
            $size = (Get-Item "installer/$($info.asset)").Length
            # A delta that saves little isn't worth publishing — a release that refreshes the bundled
            # .NET runtime rewrites nearly everything, and one near-full-size delta per base would
            # multiply the release assets for no benefit. Those bases take the full installer.
            if ($size -ge $fullSize * 0.7) {
              Write-Host "Delta from $($b.Version) is $([int]($size/1MB)) MB vs $([int]($fullSize/1MB)) MB full — dropping it."
              Remove-Item "installer/$($info.asset)" -Force
              continue
            }
            Write-Host "Delta from $($b.Version): $([int]($size/1MB)) MB"
            $built += [ordered]@{ from = $info.from; asset = $info.asset }
          }

          ConvertTo-Json -InputObject @($built) -Depth 4 | Set-Content "installer/deltas.json" -Encoding utf8
          Write-Host "Built $($built.Count) delta(s)."

      - name: Write update.json
        shell: pwsh
        run: |
          # The client reads this to pick the delta whose "from" matches its installed version, else the
          # full installer. One entry per base the step above managed to build; empty means full-only.
          $to = "${{ steps.ver.outputs.version }}"
          $deltas = @()
          if (Test-Path "installer/deltas.json") {
            $deltas = @(Get-Content "installer/deltas.json" -Raw | ConvertFrom-Json |
                        ForEach-Object { [ordered]@{ from = $_.from; asset = $_.asset } })
          }
          $update = [ordered]@{
            version = $to
            full    = "TextTemplateManager-Setup-$to.exe"
            deltas  = $deltas
          }
          $update | ConvertTo-Json -Depth 4 | Set-Content "installer/update.json" -Encoding utf8
          Write-Host "----- update.json -----"; Get-Content "installer/update.json" -Raw

      - name: Render release notes from release.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = "${{ steps.ver.outputs.version }}"

          # Auto-generated "What's Changed" list (PRs/commits since the previous tag).
          $changelog = ""
          $json = gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $json) { $changelog = ($json | ConvertFrom-Json).body }
          if ([string]::IsNullOrWhiteSpace($changelog)) { $changelog = "Initial release." }

          $notes = (Get-Content release.md -Raw).
                     Replace('{{VERSION}}', $ver).
                     Replace('{{TAG}}', $tag).
                     Replace('{{CHANGELOG}}', $changelog)
          Set-Content -Path release-notes.md -Value $notes
          Write-Host "----- release notes -----"; Get-Content release-notes.md

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --draft: the release (and its installer) is uploaded but NOT published. Review it on
          # the Releases page and click "Publish release" when ready. Auto-update only sees
          # published releases, so clients won't be offered the update until you publish.
          # NOTE: GitHub does NOT preserve upload order — it returns and displays release assets
          # ALPHABETICALLY (confirmed against the published v1.3.1 and v1.4.0 releases). Upload order
          # below is therefore only about keeping this list readable; it has no effect on what a client
          # sees. What actually matters is the NAME: clients older than 1.2 take the first .exe, so
          # every other .exe must sort after "TextTemplateManager-Setup" — hence the support tool is
          # named "-Support-Cleanup" ("Setup" < "Support") and the deltas "-Update-" ("Setup" < "Update").
          # Newer clients resolve the installer by name via update.json and don't depend on order at all.
          $ghArgs = @(
            "${{ github.ref_name }}",
            "installer/TextTemplateManager-Setup-${{ steps.ver.outputs.version }}.exe"
          )
          if (Test-Path "installer/deltas.json") {
            foreach ($d in (Get-Content "installer/deltas.json" -Raw | ConvertFrom-Json)) {
              $ghArgs += "installer/$($d.asset)"
            }
          }
          $ghArgs += @(
            "installer/TextTemplateManager-Manual.pdf",
            "installer/TextTemplateManager-AdminManual.pdf",
            # An .exe, but well after the full Setup, so the first-.exe fallback never resolves to it.
            "installer/TextTemplateManager-Support-Cleanup.exe",
            "installer/manifest.json",
            "installer/update.json",
            "--title", "${{ github.ref_name }}",
            "--notes-file", "release-notes.md",
            "--draft"
          )
          if ("${{ steps.ver.outputs.prerelease }}" -eq 'true') { $ghArgs += "--prerelease" }
          gh release create @ghArgs
